[package]
name = "primebuild-store-desktop"
version = "0.1.0"
description = "PrimeBuild Official Store — read-only Shopify administration console (desktop shell)"
authors = ["PrimeBuild"]
edition = "2021"
rust-version = "1.77"

# The library target hosts the app so the same code could later target mobile.
[lib]
name = "primebuild_store_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# Desktop distribution / update system (NOT part of Core business logic):
# the official Tauri updater drives check → download → verify → install. Relaunch
# uses core `AppHandle::restart`. Full-installer (NSIS) updates replace the app.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the runtime updater endpoint from dist.config.json (already in the tree
# transitively via reqwest; declared directly for the endpoint override).
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[features]
# This feature is used for production builds where `devUrl` is disabled.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
